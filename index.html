<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; connect-src 'none'; img-src 'none'; font-src 'none'; media-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">

<title>Čtení</title>
<style>
  :root {
    --ink: #24324a;
    --muted: #5d6d86;
    --card: #fffdf8;
    --line: #d7ebf8;
    --gap: 18px;
    --space: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Avenir Next", ui-rounded, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 18% 0, #ffe56a 0 34px, #ffd24a 35px 46px, transparent 48px),
      radial-gradient(circle at 78% 12%, #fff 0 22px, transparent 24px),
      radial-gradient(circle at 88% 7%, #fff 0 14px, transparent 16px),
      linear-gradient(#9adfff 0%, #e7f7ff 38%, #fff3c9 100%);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button, .tile { font: inherit; color: inherit; }
  button {
    border: 0;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  #app {
    max-width: 760px;
    margin: 0 auto;
    min-height: 100%;
    padding: calc(12px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space);
    min-height: 52px;
    margin-bottom: var(--gap);
  }
  .menu-title {
    margin: 0;
    font-size: clamp(32px, 7vw, 44px);
    letter-spacing: -0.04em;
    color: #1f6feb;
  }
  .ghost {
    min-height: 48px;
    padding: 0 16px;
    border-radius: 999px;
    background: #fff;
    border: 3px solid #b9ddf3;
    font-weight: 800;
    box-shadow: 0 4px 0 #b9ddf3;
  }
  h1 {
    margin: 0;
    font-size: clamp(40px, 8vw, 64px);
    letter-spacing: -0.04em;
    color: #1f6feb;
  }
  .lead {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 18px;
    line-height: 1.35;
    max-width: 22em;
  }
  .start {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: var(--gap);
    padding: 4px 0 168px;
  }
  .letters-row, .grid, .words {
    display: grid;
    gap: var(--gap);
  }
  .letters-row { grid-template-columns: repeat(4, 1fr); }
  .grid { grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 640px) {
    .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .grid .wide { grid-column: 1 / -1; }
  }
  .chip, .tile, .word, .bubble, .go {
    border-radius: 28px;
  }
  .chip {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    color: white;
    font-size: clamp(36px, 8vw, 56px);
    font-weight: 800;
    box-shadow: 0 10px 0 rgba(42, 33, 24, 0.08);
  }
  .l-A { background: var(--a); }
  .l-M { background: var(--m); }
  .l-E { background: var(--e); }
  .l-L { background: var(--l); }
  .go, .tile {
    background: var(--card);
    border: 4px solid #7ec8f0;
    box-shadow: 0 8px 0 #7ec8f0;
    text-align: left;
  }
  .tile.read { border-color: #f0b429; box-shadow: 0 8px 0 #f0b429; }
  .tile.play { border-color: #ef6d7a; box-shadow: 0 8px 0 #ef6d7a; }
  .go {
    min-height: 92px;
    border-radius: 999px;
    background: #3cba6f;
    color: white;
    border-color: #249655;
    box-shadow: 0 8px 0 #249655;
    font-size: clamp(28px, 7vw, 36px);
    font-weight: 800;
    letter-spacing: 0.06em;
    text-align: center;
  }
  .go:active, .tile:active, .ghost:active, .word:active { transform: translateY(2px); }
  .tile {
    padding: 18px 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    min-height: 168px;
    border-radius: 32px;
  }
  .tile b { font-size: 26px; letter-spacing: -0.03em; line-height: 1.15; }
  .badge {
    width: 54px;
    height: 54px;
    display: grid;
    place-items: center;
    border-radius: 18px;
    background: #e8f6ff;
    font-size: 26px;
  }
  .tile.read .badge { background: #fff3cc; }
  .tile.play .badge { background: #ffe4e8; }
  .tile span, .hint { color: var(--muted); font-size: 16px; line-height: 1.3; }
  .sample {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.25;
    color: var(--ink);
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .letter-box {
    width: 92px;
    min-height: 92px;
    padding: 12px 6px 6px;
    display: grid;
    place-items: center;
    border-radius: 22px;
    color: white;
    font-size: 44px;
    font-weight: 700;
    line-height: 1.25;
  }
  .hero {
    display: grid;
    place-items: center;
    min-height: 220px;
    border-radius: 48px;
    color: white;
    font-size: clamp(96px, 22vw, 132px);
    font-weight: 700;
    line-height: 1.25;
    padding: 22px 16px 12px;
    margin-bottom: 14px;
    border: 8px solid white;
    box-shadow: 0 12px 0 rgba(36, 50, 74, 0.12);
  }
  .words { grid-template-columns: 1fr; }
  @media (min-width: 700px) {
    .words.two { grid-template-columns: 1fr 1fr; }
  }
  .word {
    background: var(--card);
    border: 4px solid #f0b429;
    box-shadow: 0 8px 0 #f0b429;
    padding: 16px 16px 18px;
    display: grid;
    justify-items: center;
    gap: 10px;
    border-radius: 32px;
  }
  .word svg { width: min(220px, 70vw); height: auto; }
  .spell {
    font-size: clamp(40px, 8vw, 64px);
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
    margin: 0;
  }
  .spell i { font-style: normal; }
  .stage {
    min-height: 38vh;
    display: grid;
    place-items: center;
    padding: 4px 0 8px;
  }
  .board {
    width: min(100%, 560px);
    min-height: 260px;
    display: grid;
    place-items: center;
    background: white;
    border: 8px solid #7ec8f0;
    border-radius: 48px;
    box-shadow: 0 12px 0 #7ec8f0;
    padding: 28px 20px 18px;
  }
  .syll {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.42em;
    margin: 0;
    color: #1a4b8c;
    font-size: clamp(76px, 18vw, 128px);
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.35;
  }
  .syll.long {
    font-size: clamp(44px, 11vw, 92px);
    gap: 0.28em;
  }
  .syll span {
    display: inline-block;
    color: inherit;
    line-height: 1.35;
    padding-top: 0.08em;
  }
  .actions {
    display: flex;
    gap: var(--space);
    margin-top: 2px;
  }
  .actions .go { flex: 1; min-width: 0; }
  .prompt {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space);
    background: white;
    border: 4px solid #ef6d7a;
    box-shadow: 0 6px 0 #ef6d7a;
    border-radius: 28px;
    padding: 12px;
    margin-bottom: var(--gap);
  }
  .prompt p {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }
  .prompt strong, .target-chip {
    min-width: 72px;
    max-width: 46%;
    min-height: 72px;
    padding: 8px 10px 6px;
    font-size: clamp(28px, 8vw, 44px);
    font-weight: 700;
    line-height: 1.15;
    display: grid;
    place-items: center;
    overflow-wrap: anywhere;
    text-align: center;
    border-radius: 18px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .target-chip.hidden {
    background: #d7ebf8 !important;
    color: transparent !important;
  }
  .peek-btn {
    flex: 0 0 auto;
    min-height: 48px;
    padding: 0 16px;
    border-radius: 999px;
    background: #fff;
    border: 3px solid #b9ddf3;
    font-weight: 800;
    box-shadow: 0 4px 0 #b9ddf3;

  .peek-btn:active { transform: translateY(2px); }
  .score {
    font-weight: 800;
    color: var(--muted);
    text-align: right;
    line-height: 1.25;
  }
  #sky {
    position: relative;
    height: min(62vh, 640px);
    border-radius: 36px;
    overflow: hidden;
    background:
      radial-gradient(circle at 16% 16%, #ffe56a 0 18px, transparent 20px),
      radial-gradient(circle at 24% 22%, #fff 0 16px, transparent 18px),
      radial-gradient(circle at 72% 28%, #fff 0 22px, transparent 24px),
      linear-gradient(#7fd4ff, #e7f8ff 68%, #fff6d0);
    border: 4px solid #7ec8f0;
    box-shadow: inset 0 -28px 0 #b7e89a;
  }
  .bubble {
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    color: white;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.2;
    padding-top: 6px;
    border: 4px solid white;
    box-shadow: 0 8px 0 rgba(42, 33, 24, 0.12);
  }
  .bubble.shake, .balloon.shake { animation: shake 0.35s linear; }
  .balloon {
    position: absolute;
    width: 100px;
    height: 126px;
    padding: 0;
    background: transparent;
    border: 0;
    box-shadow: none;
  }
  .balloon span {
    display: grid;
    place-items: center;
    width: 96px;
    height: 104px;
    margin: 0 auto;
    border-radius: 50%;
    color: white;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.15;
    padding-top: 6px;
    border: 4px solid white;
    box-shadow: inset -8px -12px 0 rgba(0, 0, 0, 0.08), 0 8px 0 rgba(36, 50, 74, 0.1);
  }
  .balloon i {
    display: block;
    width: 2px;
    height: 18px;
    margin: -2px auto 0;
    background: #7f97a8;
  }
  .bubble.wide {
    width: 136px;
    border-radius: 40px;
    font-size: 34px;
  }
  .balloon.wide { width: 144px; }
  .balloon.wide span {
    width: 136px;
    height: 96px;
    border-radius: 48px;
    font-size: 32px;
  }
  @keyframes shake {
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-4px); }
  }
  .status {
    min-height: 32px;
    margin: 10px 0 0;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
  }
  .win {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 12px;
    background: rgba(255, 246, 232, 0.92);
    text-align: center;
    padding: 20px;
  }
  .win h2 { margin: 0; font-size: 42px; }
  .picker {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    padding-bottom: 4px;
  }
  @media (min-width: 520px) {
    .picker { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  @media (min-width: 640px) {
    .picker { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px; }
  }
  .pick {
    position: relative;
    min-height: 62px;
    min-width: 0;
    padding: 10px 2px 14px;
    border-radius: 16px;
    border: 3px solid var(--line);
    background: #fff;
    box-shadow: 0 4px 0 #d7ebf8;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.15;
  }
  .pick.on {
    background: var(--c);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 0 rgba(36, 50, 74, 0.18);
  }
  .pick.long::after {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.75;
  }
  .start-bar {
    position: fixed;
    left: 50%;
    bottom: 0;
    z-index: 5;
    width: min(100%, 760px);
    transform: translateX(-50%);
    margin-top: 0;
    padding: 20px 18px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent 0%, #fff3c9 38%, #fff3c9 100%);
  }
  .start-bar .hint { margin: 0 0 10px; }
  .go:disabled { opacity: 0.4; }
  @media (max-width: 430px) {
    .actions .go { min-height: 72px; font-size: 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble.shake, .balloon.shake { animation: none; }
  }
</style>
</head>

function loadSelected() {
  try {
    const raw = localStorage.getItem("cteni-letters");
    const known = new Set(ALPHABET.map((item) => item.letter));
    const list = raw ? raw.split(",").filter((letter) => known.has(letter)) : ["A", "L", "M", "E"];
    return new Set(list.length ? list : ["A", "L", "M", "E"]);
  } catch (e) {
    return new Set(["A", "L", "M", "E"]);
  }
}

function saveSelected() {
  try { localStorage.setItem("cteni-letters", [...selected].join(",")); }
  catch (e) {}
}

function loadNumber(key) {
  try { return Number(localStorage.getItem(key) || 0); }
  catch (e) { return 0; }
}

function loadBest() {
  try { return Number(localStorage.getItem("cteni-best") || 0); }
  catch (e) { return 0; }
}

function letterColor(letter) {
  const index = ALPHABET.findIndex((item) => item.letter === letter);
  return COLORS[(index < 0 ? 0 : index) % COLORS.length];
}

function activeLetters() {
  return ALPHABET.filter((item) => selected.has(item.letter)).map((item) => item.letter);
}

function hasLetters() {
  return selected.size > 0;
}

function roundPool() {
  if (unit === "syllable") {
    const list = buildSyllables().map((item) => item.text);
    if (list.length) return list;
  }
  return activeLetters();
}

function tokenColor(text) {
  const found = buildSyllables().find((item) => item.text === text);
  return letterColor(found ? found.parts[0] : text);
}

function tokenWidth(text) {
  if (text.length > 4) return 188;
  if (text.length > 2) return 156;
  if (text.length > 1) return 136;
  return 100;
}

function roundRecord() {
  if (screen === "balloons" && unit === "syllable") return syllBalloonBest;
  if (screen === "balloons") return balloonBest;
  if (unit === "syllable") return syllBest;
  return best;
}

function saveRound() {
  const key = screen === "balloons"
    ? (unit === "syllable" ? "cteni-best-balon-slabiky" : "cteni-best-balon")
    : (unit === "syllable" ? "cteni-best-slabiky" : "cteni-best");
  const current = roundRecord();
  if (score <= current) return;
  try { localStorage.setItem(key, String(score)); }
  catch (e) {}
  if (key === "cteni-best-balon-slabiky") syllBalloonBest = score;
  else if (key === "cteni-best-balon") balloonBest = score;
  else if (key === "cteni-best-slabiky") syllBest = score;
  else best = score;
}

function paintTarget() {
  const paint = document.getElementById("target");
  if (!paint) return;
  paint.textContent = target;
  paint.style.fontSize = target.length > 4 ? "28px" : target.length > 2 ? "34px" : target.length > 1 ? "40px" : "52px";
  if (!targetVisible) {
    paint.style.background = "#d7ebf8";
    paint.style.color = "transparent";
    return;
  }
  paint.style.background = tokenColor(target);
  paint.style.color = "white";
}

function clearTargetPeek() {
  if (!targetPeekTimer) return;
  clearTimeout(targetPeekTimer);
  targetPeekTimer = 0;
}

function setTargetVisible(visible) {
  targetVisible = visible;
  const paint = document.getElementById("target");
  if (!paint) return;
  paint.classList.toggle("hidden", !visible);
  paint.setAttribute("aria-hidden", visible ? "false" : "true");
  paintTarget();
}

function revealTarget(hideAfterMs) {
  clearTargetPeek();
  setTargetVisible(true);
  if (hideAfterMs > 0) {
    targetPeekTimer = setTimeout(() => {
      targetPeekTimer = 0;
      setTargetVisible(false);
    }, hideAfterMs);
  }
}

function scheduleTargetPeek() {
  revealTarget(TARGET_PEEK_MS);
}

function nextTarget() {
  const choices = roundPool().filter((item) => item !== target);
  target = choices.length ? choices[Math.floor(Math.random() * choices.length)] : target;
  scheduleTargetPeek();
}

function splitWordToParts(word, letters) {
  const order = [...letters].sort((a, b) => b.length - a.length);
  const upper = word.toLocaleUpperCase("cs");
  const parts = [];
  for (let i = 0; i < upper.length;) {
    const letter = order.find((item) => upper.startsWith(item, i));
    if (!letter) return null;
    parts.push(letter);
    i += letter.length;
  }
  return parts.length ? parts : null;
}

function syllableWordsFor(letters) {
  const seen = new Set();
  const list = [];
  const add = (text, say) => {
    const parts = splitWordToParts(text, letters);
    if (!parts || parts.length < 3) return;
    const key = parts.join("");
    if (seen.has(key)) return;
    seen.add(key);
    list.push({ text: key, parts, say });
  };
  for (const entry of SYLLABLE_WORDS) add(entry.text, entry.say);
  for (const item of CONTENT) {
    for (const word of item.words) add(word.text, word.say);
  }
  return list;
}

function buildSyllables() {
  const letters = activeLetters();
  const vowels = letters.filter((letter) => letterOf(letter).vowel);
  const consonants = letters.filter((letter) => !letterOf(letter).vowel);
  if (vowels.length && consonants.length) {
    const list = [];
    const seen = new Set();
    for (const consonant of consonants) {
      for (const vowel of vowels) {
        const parts = [consonant, vowel];
        const text = parts.join("");
        list.push({ text, parts, say: text.toLocaleLowerCase("cs") });
        seen.add(text);
      }
    }
    for (const word of syllableWordsFor(letters)) {
      if (!seen.has(word.text)) {
        list.push(word);
        seen.add(word.text);
      }
    }
    return list;
  }
  const solo = letters.map((letter) => ({
    text: letter,
    parts: [letter],
    say: letterOf(letter).say
  }));
  const words = syllableWordsFor(letters).filter((word) => !solo.some((item) => item.text === word.text));
  return solo.concat(words);
}

function saveBest() {
  if (score <= best) return;
  best = score;
  try { localStorage.setItem("cteni-best", String(best)); }
  catch (e) {}
}

function loadBalloonBest() {
  try { return Number(localStorage.getItem("cteni-best-balon") || 0); }
  catch (e) { return 0; }
}

function saveBalloonBest() {
  if (score <= balloonBest) return;
  balloonBest = score;
  try { localStorage.setItem("cteni-best-balon", String(balloonBest)); }
  catch (e) {}
}

function blip(freq) {
  try {
    audioCtx = audioCtx || new AudioContext();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  } catch (e) {}
}

function letterOf(char) {
  const meta = ALPHABET.find((item) => item.letter === char) || { letter: char, say: char };
  const content = CONTENT.find((item) => item.letter === char);
  return {
    letter: char,
    say: meta.say,
    vowel: !!meta.vowel,
    words: content ? content.words : []
  };
}

function coloredWord(word, letter) {
  const first = word.charAt(0).toLocaleUpperCase("cs");
  const rest = word.slice(1);
  return `<i style="background:${letterColor(letter)};color:white;border-radius:12px;padding:0 8px">${first}</i>${rest}`;
}

function nextSyllable() {
  const list = buildSyllables();
  if (!list.length) return;
  if (!bag.length) bag = list.slice().sort(() => Math.random() - 0.5);
  syllable = bag.pop();
}

function stopGame() {
  cancelAnimationFrame(loop);
  loop = 0;
  bubbles = [];
  clearTargetPeek();
  targetVisible = false;
}

}

function setupGame() {
  won = false;
  score = 0;
  const letters = roundPool();
  if (!letters.length) return;
  target = letters[Math.floor(Math.random() * letters.length)];
  const sky = document.getElementById("sky");
  scheduleTargetPeek();
  const width = sky.clientWidth;
  const height = sky.clientHeight;
  const count = unit === "syllable" ? 5 : 7;
  bubbles = Array.from({ length: count }, (_, index) => makeBubble(sky, width, height, index < 2 ? target : null));
  let last = performance.now();
  const step = (now) => {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    const slow = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.25 : 1;
    for (const bubble of bubbles) {
      bubble.x += bubble.vx * dt * slow;
      bubble.y += bubble.vy * dt * slow;
      if (bubble.x < 0 || bubble.x > width - bubble.w) bubble.vx *= -1;
      if (bubble.y < 0 || bubble.y > height - bubble.h) bubble.vy *= -1;
      bubble.x = Math.max(0, Math.min(width - bubble.w, bubble.x));
      bubble.y = Math.max(0, Math.min(height - bubble.h, bubble.y));
    }
    for (let i = 0; i < bubbles.length; i++) {
      for (let j = i + 1; j < bubbles.length; j++) {
        const a = bubbles[i];
        const b = bubbles[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const need = (a.w + b.w) / 2 + 16;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < need) {
          const push = (need - dist) / 2;
          dx /= dist;
          dy /= dist;
          a.x -= dx * push;
          a.y -= dy * push;
          b.x += dx * push;
          b.y += dy * push;
        }
      }
    }
    for (const bubble of bubbles) {
      bubble.el.style.left = bubble.x + "px";
      bubble.el.style.top = bubble.y + "px";
    }
    loop = requestAnimationFrame(step);
  };
  loop = requestAnimationFrame(step);
}

function makeBubble(sky, width, height, forced) {
  const pool = roundPool();
  const letter = forced || pool[Math.floor(Math.random() * pool.length)];
  const el = document.createElement("button");
  const w = tokenWidth(letter);
  el.className = "bubble" + (letter.length > 1 ? " wide" : "");
  el.style.background = tokenColor(letter);
  el.style.width = w + "px";
  if (letter.length > 2) el.style.fontSize = "30px";
  else if (letter.length > 1) el.style.fontSize = "34px";
  el.textContent = letter;
  el.dataset.action = "catch";
  el.dataset.letter = letter;
  const bubble = {
    letter,
    el,
    w,
    h: 100,
    x: Math.random() * Math.max(1, width - w),
    y: Math.random() * Math.max(1, height - 100),
    vx: (40 + Math.random() * 50) * (Math.random() < 0.5 ? -1 : 1),
    vy: (30 + Math.random() * 40) * (Math.random() < 0.5 ? -1 : 1)
  };
  el.style.left = bubble.x + "px";
  el.style.top = bubble.y + "px";
  sky.appendChild(el);
  return bubble;
}

function setupBalloons() {
  won = false;
  score = 0;
  const letters = roundPool();
  if (!letters.length) return;
  target = letters[Math.floor(Math.random() * letters.length)];
  const sky = document.getElementById("sky");
  scheduleTargetPeek();
  const width = sky.clientWidth;
  const height = sky.clientHeight;
  bubbles = [0, 1, 2, 3].map((index) => makeBalloon(
    sky,
    width,
    height,
    index === 0 ? target : null,
    height - 20 - index * (height / 4)
  ));
  let last = performance.now();
  const step = (now) => {
    if (won) return;
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    const slow = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.45 : 1;
    for (const balloon of bubbles) {
      balloon.y += balloon.vy * dt * slow;
      balloon.x += balloon.vx * dt * slow;
      if (balloon.x < 0 || balloon.x > width - balloon.w) balloon.vx *= -1;
      balloon.x = Math.max(0, Math.min(width - balloon.w, balloon.x));
    }
    for (let i = 0; i < bubbles.length; i++) {
      for (let j = i + 1; j < bubbles.length; j++) {
        const a = bubbles[i];
        const b = bubbles[j];
        const dx = b.x - a.x;
        const need = (a.w + b.w) / 2 + 10;
        if (Math.abs(dx) < need && Math.abs(b.y - a.y) < 120) {
          const push = (need - Math.abs(dx)) / 2;
          const dir = dx < 0 ? -1 : 1;
          a.x -= dir * push;
          b.x += dir * push;
        }
      }
    }
    const gone = bubbles.filter((balloon) => balloon.y < -130);
    for (const balloon of gone) recycleBalloon(balloon, sky, width, height);
    for (const balloon of bubbles) {
      balloon.el.style.left = balloon.x + "px";
      balloon.el.style.top = balloon.y + "px";
    }
    loop = requestAnimationFrame(step);
  };
  loop = requestAnimationFrame(step);
}

function makeBalloon(sky, width, height, forced, startY) {
  const pool = roundPool();
  const letter = forced || pool[Math.floor(Math.random() * pool.length)];
  const w = tokenWidth(letter);
  const el = document.createElement("button");
  el.className = "balloon" + (letter.length > 1 ? " wide" : "");
  el.dataset.action = "pop";
  el.dataset.letter = letter;
  const face = document.createElement("span");
  face.textContent = letter;
  face.style.background = tokenColor(letter);
  face.style.width = w + "px";
  if (letter.length > 2) face.style.fontSize = "28px";
  else if (letter.length > 1) face.style.fontSize = "32px";
  const string = document.createElement("i");
  el.append(face, string);
  const balloon = {
    letter,
    el,
    w,
    x: Math.random() * Math.max(1, width - w),
    y: startY == null ? height - 8 : startY,
    vx: (10 + Math.random() * 14) * (Math.random() < 0.5 ? -1 : 1),
    vy: -(38 + Math.random() * 18)
  };
  el.style.left = balloon.x + "px";
  el.style.top = balloon.y + "px";
  sky.appendChild(el);
  return balloon;
}

function paintBalloon(balloon, letter) {
  balloon.letter = letter;
  balloon.w = tokenWidth(letter);
  balloon.el.dataset.letter = letter;
  balloon.el.className = "balloon" + (letter.length > 1 ? " wide" : "");
  const face = balloon.el.querySelector("span");
  face.textContent = letter;
  face.style.background = tokenColor(letter);
  face.style.width = balloon.w + "px";
  face.style.fontSize = letter.length > 2 ? "28px" : letter.length > 1 ? "32px" : "40px";
}

function recycleBalloon(balloon, sky, width, height) {
  balloon.el.remove();
  const index = bubbles.indexOf(balloon);
  if (index >= 0) bubbles.splice(index, 1);
  const needTarget = !bubbles.some((item) => item.letter === target);
  bubbles.push(makeBalloon(sky, width, height, needTarget ? target : null, height - 8));
}

function popBalloon(el) {
  if (won || screen !== "balloons") return;
  const letter = el.dataset.letter;
  const status = document.getElementById("status");
  if (letter !== target) {
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
    status.textContent = "Zkus jiné";
    blip(180);
    return;
  }
  blip(620);
  score += 1;
  saveRound();
  document.getElementById("score").textContent = String(score);
  const index = bubbles.findIndex((item) => item.el === el);
  const sky = document.getElementById("sky");
  if (index >= 0) {
    bubbles[index].el.remove();
    bubbles.splice(index, 1);
  }
  if (score >= WIN_GOAL) {
    won = true;
    cancelAnimationFrame(loop);
    sky.insertAdjacentHTML("beforeend", `<div class="win">
      <h2>Výborně!</h2>
      <p>Chytil jsi ${WIN_GOAL} ${unit === "syllable" ? "slabik" : "balónků"}.</p>
      <button class="go" data-action="${unit === "syllable" ? "syll-balloons" : "balloons"}">Hrát znovu</button>
    </div>`);
    return;
  }
  nextTarget();
  if (!bubbles.some((item) => item.letter === target)) {
    const lowest = bubbles.slice().sort((a, b) => b.y - a.y)[0];
    if (lowest) paintBalloon(lowest, target);
  }
  bubbles.push(makeBalloon(sky, sky.clientWidth, sky.clientHeight, null, sky.clientHeight - 8));
  status.textContent = "Výborně!";
}

function catchLetter(el) {
  if (won) return;
  const letter = el.dataset.letter;
  const status = document.getElementById("status");
  if (letter !== target) {
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
    status.textContent = "Zkus jiné";
    blip(180);
    return;
  }
  blip(620);
  score += 1;
  saveRound();
  document.getElementById("score").textContent = String(score);
  const index = bubbles.findIndex((item) => item.el === el);
  if (index >= 0) bubbles.splice(index, 1);
  el.remove();
  if (score >= WIN_GOAL) {
    won = true;
    cancelAnimationFrame(loop);
    const sky = document.getElementById("sky");
    sky.insertAdjacentHTML("beforeend", `<div class="win">
      <h2>Výborně!</h2>
      <p>Chytil jsi ${WIN_GOAL} ${unit === "syllable" ? "slabik" : "písmen"}.</p>
      <button class="go" data-action="${unit === "syllable" ? "syll-game" : "game"}">Hrát znovu</button>
    </div>`);
    return;
  }
  nextTarget();
  const sky = document.getElementById("sky");
  bubbles.push(makeBubble(sky, sky.clientWidth, sky.clientHeight, null));
  let have = bubbles.filter((item) => item.letter === target).length;
  for (const bubble of bubbles) {
    if (have >= 2) break;
    if (bubble.letter !== target) {
      bubble.letter = target;
      bubble.w = tokenWidth(target);
      bubble.el.dataset.letter = target;
      bubble.el.textContent = target;
      bubble.el.className = "bubble" + (target.length > 1 ? " wide" : "");
      bubble.el.style.background = tokenColor(target);
      bubble.el.style.width = bubble.w + "px";
      bubble.el.style.fontSize = target.length > 2 ? "30px" : target.length > 1 ? "34px" : "40px";
      have += 1;
    }
  }
  status.textContent = "Výborně!";
}

function onClick(event) {
  const node = event.target.closest("[data-action]");
  if (!node) return;
  const action = node.dataset.action;
  if (action === "toggle") {
    const letter = node.dataset.letter;
    if (selected.has(letter)) selected.delete(letter);
    else selected.add(letter);
    saveSelected();
    bag = [];
    letterBag = [];
    node.classList.toggle("on", selected.has(letter));
    const picked = document.getElementById("picked");
    const go = app.querySelector(".go");
    if (picked) picked.textContent = selected.size + " vybraných";
    if (go) go.disabled = selected.size === 0;
    return;
  }
  if (action === "menu" && !hasLetters()) return;
  if (action === "peek-target") {
    revealTarget(TARGET_PEEK_MS);
    return;
  }
  if (action === "catch") {
    catchLetter(node);
    return;
  }
  if (action === "letters") {
    if (!hasLetters()) return;
    nextReadingLetter();
    screen = "letters";
    render();
    return;
  }
  if (action === "next-letter") {
    nextReadingLetter();
    render();
    return;
  }
  if (action === "syllables") {
    if (!hasLetters()) return;
    nextSyllable();
    screen = "syllables";
    render();
    return;
  }
  if (action === "next-syllable") {
    nextSyllable();
    render();
    return;
  }
  if (action === "game") {
    if (!hasLetters()) return;
    unit = "letter";
    screen = "game";
    render();
    return;
  }
  if (action === "balloons") {
    if (!hasLetters()) return;
    unit = "letter";
    screen = "balloons";
    render();
    return;
  }
  if (action === "syll-game") {
    if (!hasLetters()) return;
    unit = "syllable";
    screen = "game";
    render();
    return;
  }
  if (action === "syll-balloons") {
    if (!hasLetters()) return;
    unit = "syllable";
    screen = "balloons";
    render();
    return;
  }
  if (action === "pop") {
    popBalloon(node);
    return;
  }
  screen = action;
  render();
}
</script>
</body>
</html>
